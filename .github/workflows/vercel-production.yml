name: Vercel production deployment

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: vercel-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Migrate and deploy production
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check out verified source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Verify deployment secrets
        shell: bash
        run: |
          test -n "$DATABASE_URL"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
          test -n "$VERCEL_TOKEN"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply production database migrations
        run: pnpm db:migrate:deploy
      - name: Pull Vercel production configuration
        run: pnpm exec vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build Vercel output
        run: pnpm exec vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy production
        id: deploy
        shell: bash
        run: |
          url=$(pnpm exec vercel deploy --prebuilt --prod --archive=tgz --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Production deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
