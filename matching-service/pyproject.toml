[project]
name = "hireme-matching-service"
version = "2.0.0"
description = "Explainable hybrid candidate-ranking API for HireME."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.14",
  "joblib==1.5.2",
  "lightgbm==4.6.0",
  "numpy==2.3.4",
  "pydantic==2.11.7",
  "scikit-learn==1.7.2",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
