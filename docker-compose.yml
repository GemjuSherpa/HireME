services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: hireme }
    ports: ["5432:5432"]
    volumes: ["hireme_postgres:/var/lib/postgresql/data"]
  matching:
    image: python:3.12-slim
    working_dir: /app
    volumes: ["./matching-service:/app"]
    command: sh -c "pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --reload"
    ports: ["8000:8000"]
volumes: { hireme_postgres: {} }
